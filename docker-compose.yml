services:
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://backend:4000
      NEXT_PUBLIC_ABELIAN_EXPLORER_BASE_URL: ${NEXT_PUBLIC_ABELIAN_EXPLORER_BASE_URL:-https://explorer.abelian.info}
      NEXT_PUBLIC_DEMO_MODE: ${DEMO_MODE:-true}
      NEXT_PUBLIC_LLM_PROVIDER: webllm
      NEXT_PUBLIC_LLM_PROXY_URL: http://backend:4000/api/llm
    ports:
      - "3000:3000"
    depends_on:
      - backend

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - .env
    environment:
      PORT: 4000
      HOST: 0.0.0.0
      JWT_SECRET: ${JWT_SECRET}
      ABELIAN_RPC_URL: ${ABELIAN_RPC_URL}
      ABELIAN_RPC_TOKEN: ${ABELIAN_RPC_TOKEN}
      FEDERATED_URL: ${FEDERATED_URL}
      LLAMA_CPP_URL: ${LLAMA_CPP_URL}
      LLAMA_MODEL: ${LLAMA_MODEL:-phi-3-mini-4k-instruct-q4_k_m.gguf}
      LLAMA_TIMEOUT_MS: ${LLAMA_TIMEOUT_MS:-5000}
      LLAMA_MAX_TOKENS: ${LLAMA_MAX_TOKENS:-300}
      LLAMA_TOP_P: ${LLAMA_TOP_P:-0.9}
      LLAMA_REPEAT_PENALTY: ${LLAMA_REPEAT_PENALTY:-1.1}
      LLAMA_SEED: ${LLAMA_SEED:-42}
      LIGHTWAY_PROXY_URL: ${LIGHTWAY_PROXY_URL}
      DEMO_MODE: ${DEMO_MODE:-true}
      RATE_LIMIT_MAX: 120
      RATE_LIMIT_WINDOW: 1 minute
    ports:
      - "4000:4000"
    depends_on:
      - federated
      - lightway
      - llama-cpp

  federated:
    build:
      context: ./infra/federated
      dockerfile: Dockerfile
    ports:
      - "8081:8081"

  llama-cpp:
    image: ghcr.io/ggml-org/llama.cpp:server
    command:
      - "--model"
      - "/models/${LLAMA_MODEL:-phi-3-mini-4k-instruct-q4_k_m.gguf}"
      - "--host"
      - "0.0.0.0"
      - "--port"
      - "8080"
      - "--ctx-size"
      - "4096"
      - "--seed"
      - "${LLAMA_SEED:-42}"
      - "--threads"
      - "4"
      - "--n-gpu-layers"
      - "0"
      - "--no-warmup"
    volumes:
      - ./models:/models:ro
    environment:
      LLAMA_CACHE: "0"
    mem_limit: 3500m
    cpus: 2.0
    ports:
      - "8080:8080"

  lightway:
    build:
      context: ./infra/lightway
      dockerfile: Dockerfile
    environment:
      LIGHTWAY_TOKEN: ${ABELIAN_RPC_TOKEN}
      LIGHTWAY_REMOTE_HOST: example-vpn-gateway
      LIGHTWAY_REMOTE_PORT: "443"
      LIGHTWAY_ENABLE_MLKEM: "true"
      LIGHTWAY_FALLBACK_DIRECT: "true"
    ports:
      - "8090:8090"

networks:
  default:
    name: mindvault-net
