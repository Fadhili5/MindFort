# ─────────────────────────────────────────────────────────────────────
# MindVault — Docker Compose
# Starts all services: api, federated, ollama, lightway (via api stub)
# Usage: docker compose -f infra/docker-compose.yml up
# ─────────────────────────────────────────────────────────────────────

services:
  # ── Backend API ──────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    ports:
      - "3001:3001"
    environment:
      PORT: 3001
      HOST: 0.0.0.0
      NODE_ENV: development
      ABELIAN_NODE_URL: http://localhost:8732
      FED_SERVER_URL: http://federated:8000
      LIGHTWAY_MODE: stub
      LIGHTWAY_PSK: stub-psk
      CORS_ORIGIN: http://localhost:3000
      BACKEND_DILITHIUM_PRIVATE_KEY: stub
    depends_on:
      federated:
        condition: service_started
      ollama:
        condition: service_started
    restart: unless-stopped

  # ── Federated Learning Server (FedAvg) ───────────────────────────
  federated:
    build:
      context: ./federated
    ports:
      - "8000:8000"
    restart: unless-stopped

  # ── Ollama LLM Sidecar (dev mode) ───────────────────────────────
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-models:/root/.ollama
    restart: unless-stopped

  # ── Frontend (Next.js) ──────────────────────────────────────────
  # Uncomment when frontend/ is built (Task 6)
  # frontend:
  #   build:
  #     context: ..
  #     dockerfile: apps/web/Dockerfile
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     NEXT_PUBLIC_API_URL: http://api:3001
  #     LLM_PROVIDER: ollama
  #   depends_on:
  #     - api

volumes:
  ollama-models:
